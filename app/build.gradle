plugins {
    id 'com.android.application'
}

android {
    namespace 'com.receipts.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.receipts.app"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "2.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}

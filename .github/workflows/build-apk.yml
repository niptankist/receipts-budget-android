name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix AndroidManifest
        run: |
          python3 -c 'ns = "http://" + "schemas." + "android" + ".com/apk/res/android"; xml = f"""<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="{ns}">\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.any" android:required="false" />\n    <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:theme="@android:style/Theme.Material.Light.DarkActionBar" android:allowBackup="true">\n        <activity android:name=".MainActivity" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n        <activity android:name=".ScanActivity" android:exported="false" android:theme="@android:style/Theme.Material.NoActionBar" />\n    </application>\n</manifest>\n"""; open("app/src/main/AndroidManifest.xml", "w").write(xml)'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Keystore
        run: keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=ReceiptsApp, OU=Dev, O=Receipts, L=NN, S=NN, C=RU"

      - name: Build Signed Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: receipts-budget-release-apk
          path: app/build/outputs/apk/release/*.apk
